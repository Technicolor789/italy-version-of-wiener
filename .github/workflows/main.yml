name: Build Fermata

on: push

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli lib install "TFT_eSPI@2.5.43" "WiFiManager@2.0.17"

      - name: Configure TFT_eSPI for the T-Display S3
        run: |
          f="$HOME/Arduino/libraries/TFT_eSPI/User_Setup_Select.h"
          sed -i 's|^#include <User_Setup.h>|//#include <User_Setup.h>|' "$f"
          sed -i 's|^//#include <User_Setups/Setup206_LilyGo_T_Display_S3.h>|#include <User_Setups/Setup206_LilyGo_T_Display_S3.h>|' "$f"
          grep -n "Setup206" "$f"

      - name: Compile
        run: |
          arduino-cli compile --fqbn esp32:esp32:lilygo_t_display_s3 --warnings default \
            --output-dir build fermata

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: fermata-firmware
          path: build/*.bin

  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf bindings
        run: pip install gtfs-realtime-bindings
      - name: Run tests
        run: sh tools/test_gtfsrt.sh
